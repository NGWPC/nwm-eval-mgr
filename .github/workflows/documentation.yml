name: documentation

on:
  push:
    branches: [ "yliu_NGWPC-10472_refactor_eval_mgr" ]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install .[docs]
      - name: Debug Python imports
        run: |
          python -c "import nwm_eval.configuration; print('Import nwm_eval OK')"
          python -c "import nwm_metrics.calculate_metrics; print('Import nwm_metrics OK')"
      - name: Sphinx build
        run: |
          sphinx-build docs/source docs/build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/build/
          force_orphan: true
