[metadata]
name = ngen.eval
version = attr: ngen.eval._version.__version__
author = Yuqiong Liu
author_email = Yuqiong.Liu@ertcorp.com
description = A library to perform evaluation of NextGen formulations
long_description = file: README.md
long_description_content_type = text/markdown
license = USDOC
license_files = LICENSE
url = https://github.com/NGWPC/nwm-eval-mgr
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Education
    Intended Audience :: Science/Research
    License :: Free To Use But Restricted
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Topic :: Scientific/Engineering :: Hydrology
    Operating System :: OS Independent

[options]
packages = find_namespace:
package_dir =
    = src
install_requires =
    hydrotools.events==1.1.5
    hydrotools.metrics==1.3.3
    hydrotools.nwis_client
    hydrotools_restclient
    numpy<2
    pandas
    scipy
    setuptools

python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = src

[options.extras_require]
develop =
    pytest
    pytest-mock
